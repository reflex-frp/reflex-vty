name: github-action

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.8', '9.12' ]
        os: ['ubuntu-latest', 'macos-latest']
        experimental: [false]
        include:
          - os: 'windows-latest'
            ghc: '9.8'
            experimental: false
          - os: 'windows-latest'
            ghc: '9.12'
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        # Cabal < 3.10.2 cannot verify current Hackage root metadata.
        cabal-version: '3.16.1.0'
    - name: Cache
      uses: actions/cache@v3
      env:
        cache-name: cache-cabal
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ghc }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.ghc }}-build-
          ${{ runner.os }}-${{ matrix.ghc }}-
          ${{ runner.os }}

    - name: Install dependencies
      run: cabal build --only-dependencies --enable-tests --enable-benchmarks all
    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all
    - name: Run tests
      run: cabal test all --enable-tests
    - if: matrix.ghc != '8.4.4'
      # disable doc builds on older ghcs because some dependency docs aren't compatible
      name: Build Docs
      run: cabal haddock all

  packaged-source:
    runs-on: ubuntu-latest
    env:
      REFLEX_VTY_GOLDEN_UPDATE: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.3'
        cabal-version: '3.16.1.0'
    - run: cabal update
    - run: cabal sdist all
    - name: Check packaged fixtures and run the extracted suites
      shell: python
      run: |
        import pathlib
        import subprocess
        import tarfile
        import tempfile

        def find_archives():
            archives = {}
            for path in pathlib.Path("dist-newstyle/sdist").glob("*.tar.gz"):
                with tarfile.open(path) as archive:
                    for name in archive.getnames():
                        parts = name.split("/")
                        if len(parts) == 2 and parts[1].endswith(".cabal"):
                            archives[parts[1][: -len(".cabal")]] = path
            return archives

        archives = find_archives()
        expected_packages = {"reflex-vty", "reflex-vty-widgets"}
        assert set(archives) == expected_packages, archives

        expected = {str(p): p.read_bytes() for p in pathlib.Path("test/goldens").glob("*.txt")}
        assert expected, "No repository goldens found"

        with tempfile.TemporaryDirectory() as directory:
            sources = {}
            for package, path in archives.items():
                with tarfile.open(path) as archive:
                    roots = {name.split("/")[0] for name in archive.getnames()}
                    assert len(roots) == 1, (package, roots)
                    root = roots.pop()
                    assert root == f"{package}-" + root.rsplit("-", 1)[1], root
                    if package == "reflex-vty":
                        for name, content in expected.items():
                            member = archive.extractfile(f"{root}/{name}")
                            assert member is not None and member.read() == content, name
                        # Both shared test-support modules must ship in the
                        # core archive.
                        for helper in (
                            "test-support/Reflex/Vty/Test/AppHarness.hs",
                            "test-support/Reflex/Vty/Test/Snapshot.hs",
                        ):
                            assert any(n.endswith(helper) for n in archive.getnames()), helper
                    else:
                        # The companion archive must contain the shared
                        # test-support modules and its registered specs.
                        for required in (
                            "test-support/Reflex/Vty/Test/AppHarness.hs",
                            "test-support/Reflex/Vty/Test/Snapshot.hs",
                            "test/Spec.hs",
                            "test/Reflex/Vty/Widget/KeySpec.hs",
                            "test/Reflex/Vty/Widget/Layout/SpacingSpec.hs",
                            "test/Reflex/Vty/Widget/GridSpec.hs",
                            "test/Reflex/Vty/Widget/PaginatorSpec.hs",
                            "test/Reflex/Vty/Widget/OverlaySpec.hs",
                            "app/Main.hs",
                            "app/Example/TierA.hs",
                        ):
                            assert any(n.endswith(required) for n in archive.getnames()), required
                    archive.extractall(directory, filter="data")
                    sources[package] = pathlib.Path(directory) / root

            def write_project(path, packages):
                path.write_text(
                    "packages: " + "\n          ".join([""] + [str(sources[p]) for p in packages]) + "\n"
                )

            # Both packages together.
            project = pathlib.Path(directory) / "cabal.project"
            write_project(project, ["reflex-vty", "reflex-vty-widgets"])
            subprocess.run(
                ["cabal", "test", "all", "--enable-tests", "--test-show-details=direct"],
                cwd=directory, check=True,
            )
            for name, content in expected.items():
                assert (sources["reflex-vty"] / name).read_bytes() == content, f"Golden rewritten: {name}"

            # Core alone: its bundled test-support sources must suffice
            # without the companion package present.
            core_project = pathlib.Path(directory) / "cabal.project.core"
            write_project(core_project, ["reflex-vty"])
            subprocess.run(
                ["cabal", "test", "all", "--enable-tests", "--test-show-details=direct", "--project-file=cabal.project.core"],
                cwd=directory, check=True,
            )
            for name, content in expected.items():
                assert (sources["reflex-vty"] / name).read_bytes() == content, f"Golden rewritten: {name}"

  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.3'
        cabal-version: '3.16.1.0'
    - run: cabal update
    - run: cabal build -ftest-tools reflex-vty-test-driver
    - name: Check terminal input and shutdown
      shell: bash
      run: python3 test/pty_smoke.py "$(cabal list-bin -ftest-tools reflex-vty-test-driver)"

  coverage:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      REFLEX_VTY_GOLDEN_UPDATE: '0'
      REFLEX_VTY_COVERAGE_CHILD_DIR: ${{ github.workspace }}/dist-coverage/child-tix
    steps:
    - uses: actions/checkout@v4
    - name: Pin coverage toolchain metadata
      # Current GHCup metadata resolves 9.12.3 to 9.12.3.20260311.
      # HPC baselines require the original compiler, not a dated rebuild.
      shell: python
      run: |
        import json
        import pathlib

        base = "https://raw.githubusercontent.com/haskell/ghcup-metadata/9ce5a2cf018443f8ea9c9f4a06726279066e05e9"
        config = pathlib.Path.home() / ".ghcup" / "config.yaml"
        config.parent.mkdir(parents=True, exist_ok=True)
        config.write_text(json.dumps({
            "url-source": [
                base + "/ghcup-0.0.9.yaml",
                base + "/ghcup-vanilla-0.0.9.yaml",
            ]
        }))
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12.3'
        cabal-version: '3.16.1.0'
    - name: Verify coverage compiler
      run: |
        actual="$(ghc --numeric-version)"
        test "$actual" = 9.12.3 || { echo "Coverage requires GHC 9.12.3, got $actual"; exit 1; }
    - run: cabal update
    - name: Install the specified Cabal metadata reader
      run: cabal install --lib Cabal-3.16.1.0 extra --package-env="$RUNNER_TEMP/reflex-vty-coverage.env"
    - name: Build the instrumented libraries and test suite
      run: cabal build reflex-vty-test --enable-tests --builddir=dist-coverage --disable-optimization --enable-coverage
    - name: Check coverage calculations
      run: |
        runghc -package-env="$RUNNER_TEMP/reflex-vty-coverage.env" \
          -package=Cabal -package=hpc -package=extra -package=directory \
          -package=filepath -package=process -package=time -package=containers \
          test/Coverage.hs self-test
    - name: Run the instrumented test suite
      run: |
        mkdir -p "$REFLEX_VTY_COVERAGE_CHILD_DIR"
        touch "$REFLEX_VTY_COVERAGE_CHILD_DIR/run-start"
        cabal test reflex-vty-test --enable-tests --builddir=dist-coverage --disable-optimization --enable-coverage --test-show-details=direct
    - name: Check coverage against the baseline
      run: |
        runghc -package-env="$RUNNER_TEMP/reflex-vty-coverage.env" \
          -package=Cabal -package=hpc -package=extra -package=directory \
          -package=filepath -package=process -package=time -package=containers \
          test/Coverage.hs check dist-coverage test/coverage-baseline.tsv dist-coverage/report
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: complete-library-coverage
        path: |
          dist-coverage/report
          dist-coverage/**/*.tix
          dist-coverage/**/hpc
